name: CI - Build, Lint & Test

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

jobs:
  build-lint-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push Database Schema
        run: npx prisma db push
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/testdb"
          DIRECT_URL: "postgresql://user:password@localhost:5432/testdb"

      - name: Lint code
        run: npm run lint

      - name: Build project
        run: npm run build
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/testdb"
          DIRECT_URL: "postgresql://user:password@localhost:5432/testdb"

      - name: Run unit and integration tests
        run: npm run test:run
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/testdb"
          DIRECT_URL: "postgresql://user:password@localhost:5432/testdb"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:3000
          DATABASE_URL: "postgresql://user:password@localhost:5432/testdb"
          DIRECT_URL: "postgresql://user:password@localhost:5432/testdb"

      # ============================================================
      # Artifact Upload Configuration
      # Retention: 30 days (configurable)
      # Reports are EXCLUDED from git (see .gitignore)
      # ============================================================

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: test-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload failure artifacts (screenshots & videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures-${{ github.run_number }}
          path: |
            screenshots/
            videos/
          retention-days: 30
          if-no-files-found: ignore

      - name: Comment PR with artifact link
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ E2E tests failed in run #${{ github.run_number }}\n\n📊 **Artifacts Available:**\n- [Playwright Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n- Retention: 30 days\n\n📝 Check the GitHub Actions tab for detailed reports.`
            })

