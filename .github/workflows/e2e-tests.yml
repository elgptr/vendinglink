name: E2E Tests — Playwright

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]
  schedule:
    # Run E2E tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push Database Schema
        run: npx prisma db push
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/testdb"
          DIRECT_URL: "postgresql://user:password@localhost:5432/testdb"

      - name: Seed Database
        run: npm run db:seed
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/testdb"
          DIRECT_URL: "postgresql://user:password@localhost:5432/testdb"

      - name: Build project
        run: npm run build
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/testdb"
          DIRECT_URL: "postgresql://user:password@localhost:5432/testdb"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests (${{ matrix.browser }})
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:3000
          DATABASE_URL: "postgresql://user:password@localhost:5432/testdb"
          DIRECT_URL: "postgresql://user:password@localhost:5432/testdb"

      - name: Upload Playwright report (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test results (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}-${{ github.run_number }}
          path: test-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload failure artifacts (${{ matrix.browser }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures-${{ matrix.browser }}-${{ github.run_number }}
          path: |
            screenshots/
            videos/
          retention-days: 30
          if-no-files-found: ignore

  e2e-results:
    name: E2E Test Results Summary
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: always()

    steps:
      - name: E2E Tests Status
        run: |
          if [ "${{ needs.e2e-tests.result }}" = "success" ]; then
            echo "✅ All E2E tests passed!"
            exit 0
          else
            echo "❌ E2E tests failed!"
            exit 1
          fi
